<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#15803d" />
    <title>GeoCollect EUDR — Cartographie & conformité des coopératives</title>
    <meta name="description" content="GeoCollect EUDR : plateforme WebSIG de collecte GPS, de suivi des producteurs et de contrôle de conformité EUDR pour les coopératives cacao et café d'Afrique de l'Ouest." />
    <meta name="keywords" content="EUDR, RDUE, déforestation, cacao, café, coopérative, cartographie, GPS, parcelles, Côte d'Ivoire, conformité" />
    <meta name="author" content="GeoCollect" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sunny-pegasus-8ea076.netlify.app/" />
    <!-- Partage sur les réseaux sociaux et messageries -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeoCollect EUDR" />
    <meta property="og:title" content="GeoCollect EUDR — Cartographie & conformité des coopératives" />
    <meta property="og:description" content="Collecte GPS des parcelles, suivi des producteurs et contrôle de conformité EUDR pour les coopératives cacao et café." />
    <meta property="og:image" content="https://sunny-pegasus-8ea076.netlify.app/pwa-512.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeoCollect" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Écran de chargement affiché pendant le téléchargement de l'application (remplacé par React au démarrage) */
      #app-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px;
        background: linear-gradient(135deg, #14532d 0%, #166534 55%, #14532d 100%);
        font-family: 'Inter', system-ui, -apple-system, sans-serif; z-index: 9999;
      }
      #app-loader .logo { width: 72px; height: 72px; animation: gc-pop .6s ease-out; }
      #app-loader .title { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
      #app-loader .sub { color: #bbf7d0; font-size: 13px; margin-top: -14px; }
      #app-loader .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; }
      #app-loader .bar > span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #4ade80; animation: gc-slide 1.1s ease-in-out infinite; }
      @keyframes gc-slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
      @keyframes gc-pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #app-loader .bar > span, #app-loader .logo { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <img class="logo" src="/favicon.svg" alt="GeoCollect" width="72" height="72" />
        <p class="title">GeoCollect EUDR</p>
        <p class="sub">Chargement de la plateforme…</p>
        <div class="bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
